<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health News</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f6f8;
    color: #1a1a1a;
    font-size: 14px;
  }

  /* ── Header ── */
  .header {
    background: #1b6e3f;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .hbrand { display: flex; align-items: center; gap: 10px; }
  .hbrand svg { opacity: .85; flex-shrink: 0; }
  .hbrand strong { font-size: 15px; }
  .hbrand small { display: block; font-size: 11px; opacity: .7; font-weight: 400; }
  .hright { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  #lu { font-size: 11px; opacity: .65; }

  .btn-refresh {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.35);
    color: #fff;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  }
  .btn-refresh:hover:not(:disabled) { background: rgba(255,255,255,.28); }
  .btn-refresh:disabled { opacity: .55; cursor: not-allowed; }
  .btn-refresh svg { transition: transform .6s; }
  .btn-refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Progress bar ── */
  .progress-bar {
    height: 3px;
    background: #e8f5e9;
    display: none;
  }
  .progress-bar.show { display: block; }
  .progress-fill {
    height: 100%; width: 0%;
    background: #4caf50;
    animation: prog 90s linear forwards;
  }
  @keyframes prog { to { width: 92%; } }

  /* ── Toolbar ── */
  .toolbar {
    background: #fff;
    border-bottom: 1px solid #e8eaed;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .fbtn {
    padding: 5px 12px;
    border: 1px solid #dde1e7;
    border-radius: 20px;
    background: #fff;
    font-size: 12px;
    color: #555;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  .fbtn:hover { border-color: #1b6e3f; color: #1b6e3f; }
  .fbtn.on { background: #1b6e3f; border-color: #1b6e3f; color: #fff; }
  .search-wrap { margin-left: auto; }
  .search-wrap input {
    border: 1px solid #dde1e7;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    outline: none;
    width: 200px;
    color: #333;
  }
  .search-wrap input:focus { border-color: #1b6e3f; }

  /* ── Stats bar ── */
  .statsbar {
    padding: 8px 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 11px;
    color: #888;
    background: #f5f6f8;
  }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }

  /* ── News list ── */
  .list { padding: 12px 20px; display: flex; flex-direction: column; gap: 0; }

  .item {
    background: #fff;
    border: 1px solid #e8eaed;
    border-radius: 10px;
    margin-bottom: 10px;
    display: flex;
    gap: 0;
    overflow: hidden;
    transition: box-shadow .15s;
  }
  .item:hover { box-shadow: 0 2px 10px rgba(0,0,0,.08); }

  .thumb {
    width: 160px;
    min-width: 160px;
    height: 110px;
    overflow: hidden;
    flex-shrink: 0;
    background: #f0f1f3;
    position: relative;
  }
  .thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .nopic {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }

  .content {
    flex: 1;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    min-width: 0;
  }

  .title {
    font-size: 14px;
    font-weight: 600;
    color: #111;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .summary {
    font-size: 12px;
    color: #666;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 2px;
  }
  .source-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    color: #fff;
    white-space: nowrap;
  }
  .pubdate { font-size: 11px; color: #aaa; }
  .read-link {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: #1b6e3f;
    text-decoration: none;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .read-link:hover { text-decoration: underline; }

  /* ── States ── */
  .state {
    text-align: center;
    padding: 60px 20px;
    color: #888;
    font-size: 14px;
  }
  .state strong { display: block; font-size: 16px; color: #555; margin: 10px 0 6px; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #333; color: #fff;
    padding: 10px 18px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .25s; z-index: 100;
    max-width: 300px;
  }
  .toast.show { opacity: 1; }
  .toast.ok  { background: #2e7d32; }
  .toast.err { background: #c62828; }

  /* ── Token modal ── */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; border-radius: 12px;
    padding: 28px 24px; width: 420px; max-width: 95vw;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
  }
  .modal h3 { margin-bottom: 8px; font-size: 16px; }
  .modal p { font-size: 13px; color: #666; margin-bottom: 16px; line-height: 1.5; }
  .modal input {
    width: 100%; border: 1px solid #dde1e7; border-radius: 6px;
    padding: 9px 12px; font-size: 13px; outline: none; margin-bottom: 16px;
  }
  .modal input:focus { border-color: #1b6e3f; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .btn-cancel {
    padding: 8px 16px; border: 1px solid #dde1e7; border-radius: 6px;
    background: #fff; font-size: 13px; cursor: pointer; color: #555;
  }
  .btn-save {
    padding: 8px 16px; border: none; border-radius: 6px;
    background: #1b6e3f; color: #fff; font-size: 13px;
    font-weight: 600; cursor: pointer;
  }
  .btn-save:hover { background: #15572f; }
  .modal a { color: #1b6e3f; font-size: 12px; }
</style>
</head>
<body>

<div class="header">
  <div class="hbrand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6h16M4 10h16M4 14h10"/>
    </svg>
    <div>
      <strong>Apotek Alpro</strong>
      <small>Health News Monitor</small>
    </div>
  </div>
  <div class="hright">
    <span id="lu"></span>
    <button class="btn-refresh" id="btnR" onclick="triggerCrawl()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      <span id="btnTxt">Crawl Sekarang</span>
    </button>
  </div>
</div>

<div class="progress-bar" id="progBar"><div class="progress-fill" id="progFill"></div></div>

<div class="toolbar">
  <button class="fbtn on" onclick="sf('all',this)">Semua</button>
  <button class="fbtn" onclick="sf('detik',this)">Detik</button>
  <button class="fbtn" onclick="sf('kompas',this)">Kompas</button>
  <button class="fbtn" onclick="sf('liputan',this)">Liputan6</button>
  <button class="fbtn" onclick="sf('tribun',this)">Tribun</button>
  <button class="fbtn" onclick="sf('tempo',this)">Tempo</button>
  <div class="search-wrap">
    <input type="search" placeholder="Cari berita..." oninput="sq(this.value)">
  </div>
</div>

<div class="statsbar" id="stats"></div>

<div class="list" id="list"></div>

<div class="toast" id="toast"></div>

<!-- GitHub PAT modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>GitHub Token Diperlukan</h3>
    <p>Untuk memicu crawl, masukkan GitHub Personal Access Token (PAT) dengan scope <strong>workflow</strong>.<br>
    Token disimpan di browser Anda saja.<br>
    <a href="https://github.com/settings/tokens/new?scopes=workflow" target="_blank" rel="noopener">Buat token baru di GitHub →</a></p>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-save" onclick="saveToken()">Simpan &amp; Crawl</button>
    </div>
  </div>
</div>

<script>
const REPO   = 'apotekalpro/BPT';
const BRANCH = 'genspark_ai_developer';
const WF     = 'crawl-news.yml';

const COLORS = {
  detik:'#e63a2e', kompas:'#c0392b', liputan:'#e67e22', tribun:'#d35400',
  tempo:'#2c3e50', cnbc:'#0056b3', republika:'#1a7c47', halodoc:'#00b4d8',
  kemenkes:'#2d6a4f', antara:'#2980b9'
};

function col(src) {
  if (!src) return '#6c757d';
  const s = src.toLowerCase();
  for (const [k,c] of Object.entries(COLORS)) if (s.includes(k)) return c;
  return '#6c757d';
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ini(src) { return (src||'?').replace(/\.(com|co\.id|id)$/i,'').slice(0,2).toUpperCase(); }

function fmt(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'Baru saja';
  if (diff < 3600) return Math.floor(diff/60) + ' mnt lalu';
  if (diff < 86400) return Math.floor(diff/3600) + ' jam lalu';
  if (diff < 86400*2) return 'Kemarin';
  // Format: "23 Nov 2026"
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
}

function dataUrl() {
  const base = location.href.replace(/\/news\.html.*$/, '');
  return base + '/public/news-data.json';
}

let all=[], fsrc='all', fq='', lastCrawledAt='', pollTimer=null;

function filtered() {
  let items = all;
  if (fsrc !== 'all') items = items.filter(a => (a.source||'').toLowerCase().includes(fsrc));
  if (fq) { const q=fq.toLowerCase(); items=items.filter(a=>a.title.toLowerCase().includes(q)||(a.summary||'').toLowerCase().includes(q)); }
  return items;
}

function render() {
  const items = filtered();
  const el = document.getElementById('list');
  if (!items.length) {
    el.innerHTML = `<div class="state"><div style="font-size:36px">🔍</div><strong>Tidak ada berita</strong>Coba ubah filter atau tunggu update berikutnya.</div>`;
    return;
  }
  el.innerHTML = items.map(a => {
    const c = a.color || col(a.source);
    const thumb = a.image
      ? `<img src="${esc(a.image)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=nopic style=background:${c}>${ini(a.source)}</div>'">`
      : `<div class="nopic" style="background:${c}">${ini(a.source)}</div>`;
    return `<div class="item">
      <div class="thumb">${thumb}</div>
      <div class="content">
        <div class="title">${esc(a.title)}</div>
        ${a.summary ? `<div class="summary">${esc(a.summary)}</div>` : ''}
        <div class="meta">
          <span class="source-badge" style="background:${c}">${esc(a.source||'Berita')}</span>
          <span class="pubdate">${fmt(a.publishedAt)}</span>
          <a class="read-link" href="${esc(a.url)}" target="_blank" rel="noopener">
            Baca selengkapnya
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
          </a>
        </div>
      </div>
    </div>`;
  }).join('');
}

function sf(src, btn) {
  fsrc=src;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}
function sq(v) { fq=v.trim(); render(); }

async function load(notify) {
  try {
    const r = await fetch(dataUrl() + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const changed = d.crawledAt !== lastCrawledAt;
    all = d.articles || [];
    lastCrawledAt = d.crawledAt || '';
    render();
    // Stats
    const src={};
    all.forEach(a=>{ src[a.source]=(src[a.source]||0)+1; });
    const top=Object.entries(src).sort((a,b)=>b[1]-a[1]).slice(0,8);
    document.getElementById('stats').innerHTML=[
      `<span><strong>${all.length}</strong> berita (14 hari terakhir)</span>`,
      ...top.map(([s,n])=>`<span><span class="dot" style="background:${col(s)}"></span>${esc(s)}: <strong>${n}</strong></span>`)
    ].join('');
    document.getElementById('lu').textContent = d.crawledAt ? 'Update: ' + fmt(d.crawledAt) : '';
    if (notify && changed) toast('✓ Berita terbaru berhasil dimuat!', 'ok');
    return changed;
  } catch(e) {
    document.getElementById('list').innerHTML = `<div class="state"><div style="font-size:36px">⚠️</div><strong>Gagal memuat data</strong>${esc(e.message)}</div>`;
    if (notify) toast('Gagal: ' + e.message, 'err');
    return false;
  }
}

// ── Token ──
function getToken() { try { return localStorage.getItem('gh_token')||''; } catch { return ''; } }
function setToken(t) { try { localStorage.setItem('gh_token',t); } catch {} }
function openModal() { document.getElementById('modalBg').classList.add('show'); document.getElementById('tokenInput').value=getToken(); setTimeout(()=>document.getElementById('tokenInput').focus(),80); }
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }
function saveToken() {
  const t=document.getElementById('tokenInput').value.trim();
  if (!t) { toast('Token tidak boleh kosong','err'); return; }
  setToken(t); closeModal(); startCrawl(t);
}
document.getElementById('modalBg').addEventListener('click',e=>{ if (e.target===e.currentTarget) closeModal(); });

// ── Crawl ──
function triggerCrawl() {
  const token=getToken();
  if (!token) { openModal(); return; }
  startCrawl(token);
}

async function startCrawl(token) {
  const btn=document.getElementById('btnR');
  const txt=document.getElementById('btnTxt');
  btn.disabled=true; btn.classList.add('spin');
  txt.textContent='Memulai...';
  showProgress(true);
  try {
    const res=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WF}/dispatches`,{
      method:'POST',
      headers:{
        'Authorization':'Bearer '+token,
        'Accept':'application/vnd.github+json',
        'Content-Type':'application/json',
        'X-GitHub-Api-Version':'2022-11-28',
      },
      body:JSON.stringify({ref:BRANCH}),
    });
    if (res.status===401||res.status===403) { setToken(''); toast('Token tidak valid, masukkan token baru.','err'); resetBtn(); openModal(); return; }
    if (res.status===404) { toast('Workflow tidak ditemukan di repo.','err'); resetBtn(); return; }
    if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.message||'HTTP '+res.status); }
    toast('🚀 Crawl dimulai! Memantau update (~1–2 menit)...','');
    txt.textContent='Menunggu data...';
    pollForUpdate();
  } catch(e) {
    toast('Gagal memulai crawl: '+e.message,'err');
    resetBtn();
  }
}

function pollForUpdate() {
  clearTimeout(pollTimer);
  let attempts=0;
  async function check() {
    attempts++;
    const changed=await load(false);
    if (changed) { toast('✅ Berita baru berhasil dimuat!','ok'); resetBtn(); showProgress(false); }
    else if (attempts>=9) { toast('Crawl selesai. Klik lagi untuk memuat ulang.',''); resetBtn(); showProgress(false); }
    else { document.getElementById('btnTxt').textContent=`Menunggu… (${attempts*20}s)`; pollTimer=setTimeout(check,20000); }
  }
  pollTimer=setTimeout(check,20000);
}

function resetBtn() {
  const btn=document.getElementById('btnR');
  btn.disabled=false; btn.classList.remove('spin');
  document.getElementById('btnTxt').textContent='Crawl Sekarang';
}
function showProgress(on) {
  const bar=document.getElementById('progBar');
  if (on) {
    bar.classList.add('show');
    const fill=document.getElementById('progFill');
    fill.style.animation='none'; void fill.offsetWidth; fill.style.animation='';
  } else { bar.classList.remove('show'); }
}
function toast(msg,type) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),5000);
}

setInterval(render,60000);
load(false);
</script>
</body>
</html>
