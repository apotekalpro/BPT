name: Crawl Health News

on:
  schedule:
    # 07:00, 11:00, 15:00 WIB = 00:00, 04:00, 08:00 UTC
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: genspark_ai_developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run news crawler
        run: node scripts/crawl-to-json.js

      - name: Commit and push news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/news-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update health news data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
